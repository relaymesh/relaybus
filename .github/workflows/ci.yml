name: CI

on:
  pull_request:
  push:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Go test
        run: go test ./...

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v3
        with:
          version: "10.19.0"
      - name: Install
        run: pnpm install
      - name: Test
        run: pnpm -r test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e sdk/core/python -e sdk/amqp/python -e sdk/http/python -e sdk/nats/python -e sdk/kafka/python pytest
      - name: Test
        run: pytest

  e2e:
    runs-on: ubuntu-latest
    needs: [go, typescript, python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v3
        with:
          version: "10.19.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Start services
        run: docker compose -f docker-compose.yaml up -d
      - name: E2E
        env:
          TS_INSTALL_CMD: pnpm install
          TS_BUILD_CMD: pnpm run build
        run: make e2e
      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.yaml down -v
