[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "relaybus-kafka"
version = "0.0.3"
description = "Relaybus Kafka publisher and subscriber"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["relaybus-core", "kafka-python>=2.0.2", "six>=1.16.0"]

[tool.hatch.build.targets.wheel]
packages = ["relaybus_kafka"]
