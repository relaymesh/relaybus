[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "relaybus-nats"
version = "0.0.5"
description = "Relaybus NATS publisher and subscriber"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["relaybus-core", "nats-py>=2.7.2"]

[tool.hatch.build.targets.wheel]
packages = ["relaybus_nats"]
