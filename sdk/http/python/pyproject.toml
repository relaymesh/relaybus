[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "relaybus-http"
version = "0.0.4"
description = "Relaybus HTTP publisher and subscriber"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["relaybus-core"]

[tool.hatch.build.targets.wheel]
packages = ["relaybus_http"]
